name: DSView Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows 10/11 x64 (MinGW-w64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSYS2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-winextras
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-zlib

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX" \
            -DPKG_CONFIG_EXECUTABLE="$MINGW_PREFIX/bin/pkg-config.exe" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel 2

      - name: Verify executable
        run: |
          test -f build.dir/DSView.exe
          file build.dir/DSView.exe

      - name: Stage application and Qt runtime
        run: |
          cmake --install build --prefix "$PWD/stage"
          mkdir -p stage/bin
          cp build.dir/DSView.exe stage/bin/
          "$MINGW_PREFIX/bin/windeployqt-qt5.exe" --release --compiler-runtime stage/bin/DSView.exe

      - name: Bundle MinGW runtime DLLs
        run: |
          # Explicitly include GCC runtime DLLs required by MinGW-built executables.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [[ -f "$MINGW_PREFIX/bin/$dll" ]]; then
              cp -n "$MINGW_PREFIX/bin/$dll" stage/bin/
            else
              echo "Missing MinGW runtime DLL: $MINGW_PREFIX/bin/$dll"
              exit 1
            fi
          done
          # Recursively bundle dependencies of the executable and all deployed DLLs.
          declare -A seen
          queue=(stage/bin/DSView.exe)
          index=0
          while (( index < ${#queue[@]} )); do
            current="${queue[$index]}"
            ((index+=1))
            while read -r library arrow dll address; do
              if [[ "$arrow" == "=>" && "$dll" == "$MINGW_PREFIX/"* && -f "$dll" ]]; then
                name="$(basename "$dll")"
                if [[ -z "${seen[$name]+x}" ]]; then
                  seen[$name]=1
                  cp -n "$dll" "stage/bin/$name"
                  queue+=("stage/bin/$name")
                fi
              fi
            done < <(ldd "$current" 2>/dev/null || true)
          done
          test -f stage/bin/libgcc_s_seh-1.dll
          test -f stage/bin/libstdc++-6.dll
          test -f stage/bin/libwinpthread-1.dll
          test -f stage/bin/libglib-2.0-0.dll
          # Python is loaded by the sigrokdecode integration at runtime; its DLL
          # may be loaded dynamically and therefore is not always visible to ldd.
          shopt -s nullglob
          python_dlls=("$MINGW_PREFIX"/bin/python*.dll)
          if (( ${#python_dlls[@]} == 0 )); then
            echo "No Python runtime DLL found in $MINGW_PREFIX/bin"
            exit 1
          fi
          cp -n "${python_dlls[@]}" stage/bin/
          # Keep application data and decoder definitions beside the executable.
          mkdir -p stage/share/DSView
          cp -r DSView/res DSView/demo lang stage/share/DSView/
          cp -r libsigrokdecode4DSL/decoders stage/share/libsigrokdecode4DSL/

      - name: Package Windows x64 build
        shell: pwsh
        run: |
          Compress-Archive -Path stage/* -DestinationPath DSView-windows-x86_64.zip -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSView-windows-x86_64
          path: DSView-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
